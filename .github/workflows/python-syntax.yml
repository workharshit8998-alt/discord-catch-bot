name: Bot syntax check

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/real-reward-delivery]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile bot source
        run: python -m py_compile main.py
